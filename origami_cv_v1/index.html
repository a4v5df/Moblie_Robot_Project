<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2-Stage Origami Robot Controller</title>
  
  <style>
    /* 1. 기본 스타일 */
    body {
      margin: 0;
      overflow: hidden;
      background-color: #1e1e1e;
      font-family: 'Segoe UI', sans-serif;
    }

    /* 2. UI 패널 스타일 */
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 240px; /* 패널 너비 약간 확장 */
      background: rgba(30, 30, 30, 0.9);
      color: #eee;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      z-index: 100;
      user-select: none;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid #444;
    }

    h1 {
      font-size: 1.1rem;
      margin: 0 0 15px 0;
      color: #fff;
      border-bottom: 2px solid #007bff;
      padding-bottom: 8px;
      text-align: center;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: #aaa;
      margin-top: 15px;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #555;
    }

    .row { 
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px; 
    }
    
    label {
      font-size: 0.85rem;
      width: 50px;
    }

    input[type=range] {
      width: 120px;
      cursor: pointer;
    }

    /* 키보드 단축키 스타일 */
    kbd {
      background-color: #444;
      border: 1px solid #666;
      border-radius: 3px;
      font-size: 0.7em;
      padding: 2px 5px;
      font-family: monospace;
      color: #fff;
    }

    /* 연결 버튼 스타일 */
    #btnConnect {
      width: 100%; 
      padding: 10px; 
      cursor: pointer; 
      background: #007bff; 
      color: white; 
      border: none; 
      border-radius: 4px; 
      font-weight: bold;
      transition: background 0.3s;
      margin-bottom: 10px;
    }
    #btnConnect:hover { background: #0056b3; }

    /* 3. 웹캠 오버레이 컨테이너 */
    #cam-container {
      position: absolute;
      top: 20px;    
      right: 20px;  
      width: 320px; 
      height: 240px;
      z-index: 150; 
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    #cam-container video {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: fill; 
      transform: scaleX(-1);
      display: block;
      z-index: 1; 
    }

    #overlay-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 2; 
    }

    /* 스크롤바 커스텀 */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #222; }
    ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #777; }
  </style>
</head>
<body>
  
  <div id="cam-container">
    <canvas id="overlay-canvas" width="320" height="240"></canvas>
  </div>

  <div id="ui">
    <h1>2-Stage Control</h1>

    <button id="btnConnect">🔌 Connect Serial</button>

    <div class="row" style="justify-content: flex-start; gap: 10px;">
      <label style="width:auto; cursor:pointer;">
        <input type="checkbox" id="panToggle"> Mouse Pan
      </label>
    </div>

    <div style="font-size: 0.75rem; color:#ccc; margin-bottom:10px; background:#333; padding:8px; border-radius:4px;">
      <div style="margin-bottom:4px;"><strong style="color:#4fc3f7;">Top (2F):</strong> <kbd>1~4</kbd> Pull / <kbd>Q~R</kbd> Relax</div>
      <div><strong style="color:#ff9800;">Btm (1F):</strong> <kbd>A~F</kbd> Pull / <kbd>Z~V</kbd> Relax</div>
    </div>

    <div class="section-title" style="color: #4fc3f7;">Top Stage (Left Hand)</div>
    <div class="row">
      <label>Up</label> 
      <input type="range" id="slider_wire2_Up" min="0" max="1" step="0.01" value="0" oninput="window.wire2_Up=parseFloat(this.value)" />
    </div>
    <div class="row">
      <label>Down</label> 
      <input type="range" id="slider_wire2_Down" min="0" max="1" step="0.01" value="0" oninput="window.wire2_Down=parseFloat(this.value)" />
    </div>
    <div class="row">
      <label>Left</label> 
      <input type="range" id="slider_wire2_Left" min="0" max="1" step="0.01" value="0" oninput="window.wire2_Left=parseFloat(this.value)" />
    </div>
    <div class="row">
      <label>Right</label> 
      <input type="range" id="slider_wire2_Right" min="0" max="1" step="0.01" value="0" oninput="window.wire2_Right=parseFloat(this.value)" />
    </div>

    <div class="section-title" style="color: #ff9800;">Bottom Stage (Right Hand)</div>
    <div class="row">
      <label>Up</label> 
      <input type="range" id="slider_wire1_Up" min="0" max="1" step="0.01" value="0" oninput="window.wire1_Up=parseFloat(this.value)" />
    </div>
    <div class="row">
      <label>Down</label> 
      <input type="range" id="slider_wire1_Down" min="0" max="1" step="0.01" value="0" oninput="window.wire1_Down=parseFloat(this.value)" />
    </div>
    <div class="row">
      <label>Left</label> 
      <input type="range" id="slider_wire1_Left" min="0" max="1" step="0.01" value="0" oninput="window.wire1_Left=parseFloat(this.value)" />
    </div>
    <div class="row">
      <label>Right</label> 
      <input type="range" id="slider_wire1_Right" min="0" max="1" step="0.01" value="0" oninput="window.wire1_Right=parseFloat(this.value)" />
    </div>

    <hr style="border-color:#444; margin: 15px 0;">
    
    <div class="section-title">Camera Settings</div>
    <div class="row">
      <label>Size</label> <input type="range" id="camSize" min="150" max="600" value="240" />
    </div>
    <div class="row">
      <label>Pos X</label> <input type="range" id="camPosX" min="0" max="100" value="95" />
    </div>
    <div class="row">
      <label>Pos Y</label> <input type="range" id="camPosY" min="0" max="100" value="5" />
    </div>

  </div>

  <div id="sketch-holder"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>
  
  <script src="serial.js"></script>
  <script src="cv_control.js"></script>
  
  <script src="origami_mk2.js"></script> 
  
  <script>
    // 카메라 UI 제어 로직 (간단 처리)
    document.addEventListener('DOMContentLoaded', () => {
      const camContainer = document.getElementById('cam-container');
      const camSize = document.getElementById('camSize');
      const camPosX = document.getElementById('camPosX');
      const camPosY = document.getElementById('camPosY');

      function updateCam() {
        const s = camSize.value + 'px';
        const x = camPosX.value + '%';
        const y = camPosY.value + '%';
        
        camContainer.style.width = s;
        camContainer.style.height = (camSize.value * 0.75) + 'px'; // 4:3 비율 유지
        camContainer.style.right = (100 - camPosX.value) + '%'; // CSS right 기준
        camContainer.style.top = y;
        
        // 오버레이 캔버스 크기 동기화 (cv_control.js가 resize를 처리하도록 유도하거나 CSS로 처리)
      }

      camSize.oninput = updateCam;
      camPosX.oninput = updateCam;
      camPosY.oninput = updateCam;
    });
  </script>
</body>
</html>
